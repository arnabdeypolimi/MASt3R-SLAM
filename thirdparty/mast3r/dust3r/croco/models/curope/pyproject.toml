[build-system]
requires = [
    "setuptools",
    "wheel",
    # Make the torch build dependency specific to linux x86_64
    "numpy" # Consider pinning numpy and/or adding platform markers if necessary
]
build-backend = "setuptools.build_meta"

[project]
name = "curope"
version = "0.0.1"
dependencies = [
    "numpy==1.26.4",
]


[tool.uv]
no-build-isolation-package = ["torch"]

[tool.setuptools]
py-modules = ["curope2d"]